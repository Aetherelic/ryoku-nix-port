--password-store=gnome-libsecret
# Pin the Wayland backend rather than trust the default. Chromium only recently
# made Wayland its default on Linux, and under Xwayland the PipeWire capturer is
# never used: getDisplayMedia falls back to X11 capture, which cannot see native
# Wayland windows, so screen sharing offers an empty or black source list.
--ozone-platform=wayland
