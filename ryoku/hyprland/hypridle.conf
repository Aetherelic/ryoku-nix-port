general {
    lock_cmd = ryoku-shell lock
    before_sleep_cmd = ryoku-shell lock
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Battery-aware idle: each stage has a battery-aggressive listener and an
# AC-relaxed one, gated by `ryoku-idle on-battery` / `on-ac` so only the matching
# one acts (the timeout still elapses on both, but the guard no-ops the wrong
# one). The screen is the biggest idle drain, so dim and DPMS-off come much sooner
# on battery. on-resume is unconditional; restoring twice is harmless.

# Dim the backlight.
listener {
    timeout = 120
    on-timeout = ryoku-idle on-battery && brightnessctl -s set 20%
    on-resume = brightnessctl -r
}
listener {
    timeout = 300
    on-timeout = ryoku-idle on-ac && brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Lock the session.
listener {
    timeout = 300
    on-timeout = ryoku-idle on-battery && ryoku-shell lock
}
listener {
    timeout = 600
    on-timeout = ryoku-idle on-ac && ryoku-shell lock
}

# Turn the screen off (DPMS) shortly after locking.
listener {
    timeout = 330
    on-timeout = ryoku-idle on-battery && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
listener {
    timeout = 660
    on-timeout = ryoku-idle on-ac && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend.
listener {
    timeout = 900
    on-timeout = ryoku-idle on-battery && systemctl suspend
}
listener {
    timeout = 1800
    on-timeout = ryoku-idle on-ac && systemctl suspend
}
