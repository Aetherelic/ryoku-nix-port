# xdg-desktop-portal-hyprland. The picker's look and layout live in
# ryoku/apps/hyprland-preview-share-picker/config.yaml.
screencopy {
    # Honour a restore token when an app asks for one, so a capture that
    # survives a restart (OBS reopening a scene) resumes its source. Browsers
    # and Discord never ask, so they still pick every time.
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
}
