# xdg-desktop-portal-hyprland config. xdph runs a standalone picker to choose
# the screen-share source: the packaged upstream hyprland-preview-share-picker,
# launched directly with no shell helper in between. Its look and layout live in
# ryoku/apps/hyprland-preview-share-picker/config.yaml.
screencopy {
    # Honour a restore token the app asks for, so a capture that survives a
    # restart (OBS reopening its scene) resumes its source instead of
    # re-prompting. Apps that never request one -- browsers, Discord -- are
    # unaffected and still pick a source every time. The picker hides the
    # matching checkbox (hide_token_restore), so this is the whole policy.
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
}
