// Resolve the graalvm buildtools plugin from the vendored maven repo in
// release/gradle-offline/repo, so a Gradle Plugin Portal outage cannot fail the
// publish gate. Passed to gradle with -I so upstream's build files stay
// unpatched.
//
// The local repo is FIRST, not exclusive: these projects also pull compile deps
// (jackson) and the plugin fetches a reachability-metadata zip, neither of which
// is vendored yet, so the upstream repositories stay as a fallback. Vendor those
// too and this can drop to --offline.
//
// beforeSettings, not settingsEvaluated: plugin resolution reads
// pluginManagement.repositories before the settings script finishes evaluating.
def repo = System.getProperty("ryoku.offline.repo")
if (!repo) throw new GradleException("ryoku.offline.repo is not set")

beforeSettings { settings ->
  settings.pluginManagement.repositories {
    maven { url = repo }
    gradlePluginPortal()
    mavenCentral()
  }
}

allprojects {
  buildscript {
    repositories {
      maven { url = repo }
      mavenCentral()
    }
  }
  repositories {
    maven { url = repo }
    mavenCentral()
  }
}
