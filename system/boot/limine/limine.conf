# Ryoku limine config = global look + branding only. deployed by the installer
# to /boot/limine.conf (the ESP root) -- the ONE config limine-entry-tool
# manages: limine-mkinitcpio-hook regenerates the UKI entries and
# limine-snapper-sync adds the Snapshots submenu in this same file, preserving
# these globals. never place a limine.conf in any other search location
# (/boot/limine/, EFI/limine/, ...): Limine stops at the first match and the
# generated entries (kernels, snapshots) would be shadowed. upstream directives:
# https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
#
# keep in sync with limineBranding in ryoku/cli/doctor.go (the live-system
# migration writes the same header).

timeout: 3

# entry 1 is the flat "/Ryoku Linux" placeholder below (offline install), which
# is bootable, so default_entry: 1 autoboots it. once limine-mkinitcpio-hook
# owns the menu, entry 1 becomes a *directory* (a directory cannot autoboot: a
# bare index would land on the /EFI fallback sibling and loop the countdown), so
# the installer's finalize and the doctor's limine-autoboot reconciler repoint
# default_entry at the kernel's entry path ("Ryoku Linux/<kernel>"). Limine
# entry paths: https://github.com/limine-bootloader/limine/blob/trunk/CONFIG.md
default_entry: 1

# remember and autoboot the last kernel booted (UEFI), so an optional CachyOS
# kernel picked once stays the default without a fixed index.
remember_last_entry: yes

interface_branding: Ryoku Bootloader
# Limine 12+ wants literal RRGGBB. Ryoku burnt-orange, the reserved accent.
interface_branding_color: C75D2B
interface_help_color: C75D2B
hash_mismatch_panic: no

term_background: 060607
backdrop: 060607

# the 力 seal on near-black; a missing file falls back to the backdrop colour.
wallpaper: boot():/ryoku-wall.png

# cream ink on near-black with a burnt-orange accent. matches the Plymouth
# splash and the shell paper, so every boot handoff is one flat colour.
term_palette: 060607;EAE2D5;C75D2B;3A3630;88A57D;C75D2B;8C857A;EAE2D5
term_palette_bright: 141210;EAE2D5;C75D2B;3A3630;88A57D;C75D2B;8C857A;EAE2D5

term_foreground: EAE2D5
term_foreground_bright: EAE2D5
term_background_bright: 141210

# fallback entry shape for installs where limine-mkinitcpio-hook never ran
# (offline). the installer appends the real flat entry itself; the hook
# replaces all of this with the /+Ryoku UKI tree (EFI/Linux/ryoku_linux.efi)
# on its first run.
/Ryoku Linux
    protocol: efi
    path: boot():/EFI/Linux/ryoku_linux.efi
