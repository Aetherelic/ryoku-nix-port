# lives at /etc/default/limine. limine-mkinitcpio-hook reads this to build
# the UKI(s) and regenerate the boot entries in /boot/limine.conf (the ESP
# root -- the only location limine-entry-tool manages).

# limine-snapper-sync matches this against the OS entry name in /boot/limine.conf
# to hang the Snapshots submenu under it. limine-entry-tool 1.37+ adopts the
# installer's flat "/Ryoku Linux" entry as the boot tree root, so that is the
# name to match; ryoku doctor re-aligns this on boxes whose menu carries a
# different vintage (the old standalone "/+Ryoku" tree reads as "Ryoku").
TARGET_OS_NAME="Ryoku Linux"

ESP_PATH="/boot"

# @@CMDLINE@@ = installer (bootloader.sh) substitutes the real root cmdline:
# root=/dev/mapper/root rootflags=subvol=@ rw, plus cryptdevice=UUID=<luks>:root
# when LUKS is on.
#
# The second line is the fixed boot-look suffix (no machine data); ryoku-boot-apply
# re-syncs this exact line onto existing boxes on update:
#   quiet splash             hand the screen to Plymouth.
#   loglevel/show_status/..  silence systemd's "[ OK ] Started ..." lines and
#                            udev/kernel chatter so the splash draws clean
#                            instead of flashing text over it.
#   initramfs_async=0        kernel 7.1 unpacks the initramfs asynchronously,
#                            which races /init: /proc, /sys, /dev and /run mount
#                            late, so plymouthd exits when it can't read
#                            /proc/cmdline -- the splash never draws (or a LUKS
#                            box drops to a text prompt). Unpack synchronously
#                            until the race is fixed upstream.
KERNEL_CMDLINE[default]+="@@CMDLINE@@"
KERNEL_CMDLINE[default]+=" quiet splash loglevel=0 systemd.show_status=false rd.udev.log_level=0 vt.global_cursor_default=0 initramfs_async=0"

ENABLE_UKI=yes
CUSTOM_UKI_NAME="ryoku"

ENABLE_LIMINE_FALLBACK=yes

# detect + chainload any other installed bootloaders.
FIND_BOOTLOADERS=yes

BOOT_ORDER="*, *fallback, Snapshots"

# btrfs snapshot entries (limine-snapper-sync wires these up). matches
# snapper's NUMBER_LIMIT (installation/backend/lib/snapshots.sh), or every
# sync warns about the surplus it can't list.
MAX_SNAPSHOT_ENTRIES=10

SNAPSHOT_FORMAT_CHOICE=5
