# Drop-in for plymouth-quit.service, installed to
# /usr/lib/systemd/system/plymouth-quit.service.d/.
#
# Keep the Ryoku boot splash (the RYOKU wordmark) in the framebuffer when
# Plymouth exits, instead of blanking to a text console. On a Wayland greeter
# (SDDM + weston) Plymouth must release DRM before the greeter's compositor can
# take it, and the greeter needs a moment to start and paint -- without
# --retain-splash the screen goes black the instant Plymouth quits, a couple of
# seconds before the greeter draws. Retaining the splash holds the logo on
# screen across that gap so the boot look bridges into the greeter instead of
# flashing black.
[Service]
ExecStart=
ExecStart=/usr/bin/plymouth quit --retain-splash
