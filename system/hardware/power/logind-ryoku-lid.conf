# Ryoku's logind policy: what a closing lid does, and how long sleep waits for
# the session to be secured. Shipped by ryoku-desktop to
# /etc/systemd/logind.conf.d/10-ryoku-lid.conf.
#
# logind suspends on lid close in EVERY case (battery, external power, docked).
# The only thing that ever keeps a closed lid awake is the ryoku-clamshell
# daemon, which holds a handle-lid-switch inhibitor while the machine is on AC
# power AND an external display is connected (macOS-style clamshell). Overriding
# the docked default (ignore) is deliberate: a mere external display must not
# keep the lid awake on battery -- power is required, matching macOS.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend

# hypridle takes a `sleep` DELAY inhibitor and runs `ryoku-shell lock` in it, so
# this is the budget the lockscreen gets before logind suspends regardless.
# logind's 5s default is not enough for a Quickshell surface that also has to
# wait out a display reconfigure (undocking as the lid shuts), and losing the
# race suspends an unlocked session -- logind says so and goes ahead:
# "Delay lock is active (hypridle) but inhibitor timeout is reached".
# 15s is headroom, not a delay anyone waits through: the inhibitor is released
# the moment the lock is up, so a normal close still suspends immediately.
InhibitDelayMaxSec=15
