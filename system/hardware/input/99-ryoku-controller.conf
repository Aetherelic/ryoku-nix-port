# Xbox controllers pair over Bluetooth, instead of refusing to.
#
# Xbox One S / Series pads speak L2CAP in a way the kernel's Enhanced Retransmission
# Mode does not tolerate: with ERTM on they either never finish pairing, or connect
# and drop within seconds. It looks like a broken controller or a broken adapter,
# and it is the single most common "my Xbox pad will not connect on Linux" report.
# (Checked: xpadneo 0.10.4 does not set this itself. Its own modprobe.d file is
# only HID aliases binding specific Xbox VID/PIDs to hid_xpadneo, so the driver
# and this option are complementary rather than redundant.)
#
# This is a modprobe option rather than a kernel command line entry on purpose:
# the bluetooth module is loaded on demand, so the option applies from the first
# load without touching the bootloader, and it survives a kernel change that a
# cmdline edit would not.
#
# The cost is narrow and worth stating. ERTM is a reliability feature for L2CAP
# links that need retransmission; disabling it globally is the trade the entire
# Linux gamepad ecosystem has already made, because the devices that need ERTM
# (some audio and HID profiles under heavy interference) degrade gracefully, while
# the controllers simply do not work at all with it on.
options bluetooth disable_ertm=1
