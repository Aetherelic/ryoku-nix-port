# Bluetooth audio devices drop seconds after connecting unless btusb autosuspend
# is off: on combo Wi-Fi+BT controllers (Intel AX2xx, Realtek RTL8761, MediaTek
# MT7921) the controller suspends in an audio stream's idle gaps and the resume
# races the link. modprobe.d, not a cmdline entry, so it applies on first btusb
# load and survives a kernel change. Separate from 99-ryoku-controller.conf,
# which sets disable_ertm on the bluetooth core module.
options btusb enable_autosuspend=0
