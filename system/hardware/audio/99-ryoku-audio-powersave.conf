# Disable HDA codec power management.
#
# The kernel default is power_save=10 (CONFIG_SND_HDA_POWER_SAVE_DEFAULT=10): the
# audio codec and its headphone amplifier power down ~10s after a stream stops and
# power back up when playback starts. On many codecs the amp's noise floor is a
# faint high-frequency hiss/whine that is audible ONLY while the codec is
# energised -- so it tracks playback and reads as a "mosquito" or tinnitus-like
# whine on headphones, gone at idle. Keeping the codec powered (power_save=0)
# removes the power-cycling and that whine, and also the click/pop some codecs
# make on the transition.
#
# Cost: a small idle draw (~0.3-0.5 W on laptops) since the codec no longer sleeps.
# Nothing re-writes this at runtime here (power management is power-profiles-daemon,
# not TLP), so the module parameter set at load sticks. To keep the power saving on
# a machine that does not hiss, drop a file in /etc/modprobe.d that sets
# power_save back on -- /etc wins over this vendor default.
options snd_hda_intel power_save=0 power_save_controller=N
