name: Cobalt setup

# The stash "Cobalt engine" switch needs a container runtime, so ryoku-docker is
# the one privileged door that provisions it: enable docker.service, ensure the
# docker group, and drive the single ryoku-cobalt container. Its polkit grant is
# passwordless, so the tests that matter are the negative ones: a bad port or an
# unknown verb must be refused BEFORE it escalates, and there is deliberately no
# docker passthrough (a `docker run` taking caller flags would be root via
# `-v /:/host`). Also checks stash-cobalt-server.sh picks the right door: direct
# docker when the session has it, the helper when it does not, and an honest
# "denied" when neither exists. See tests/cobalt-setup.sh.

on:
  pull_request:
    paths:
      - 'system/containers/**'
      - 'ryoku/hyprland/scripts/stash-cobalt-server.sh'
      - 'tests/cobalt-setup.sh'
      - '.github/workflows/cobalt-setup.yml'
  push:
    branches:
      - main
    paths:
      - 'system/containers/**'
      - 'ryoku/hyprland/scripts/stash-cobalt-server.sh'
      - 'tests/cobalt-setup.sh'
      - '.github/workflows/cobalt-setup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cobalt-setup:
    name: The container helper refuses everything outside its allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Helper argument policy and door selection
        shell: bash
        run: bash tests/cobalt-setup.sh
