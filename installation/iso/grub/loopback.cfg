# https://www.supergrubdisk.org/wiki/Loopback.cfg
#
# The boot path for loaders that hand the ISO to their own GRUB and expect the
# image to describe how to boot itself from a file: GRUB's `loopback` command,
# Super Grub Disk, and Ventoy's GRUB2 mode (the secondary-menu / Ctrl+r option).
# Ventoy's default (normal) mode presents the ISO as a device-mapper block
# device that carries the ISO's own label, so `archisosearchuuid` in the
# syslinux/systemd-boot entries finds the squashfs there. When that injection
# fails on a given firmware, archiso waits for a medium that never appears and
# drops to an initramfs rescue prompt with no working keyboard. Without this
# file the GRUB2-mode fallback is unavailable too, so such a machine has no way
# in. img_dev/img_loop name the ISO's carrier device and file path directly, so
# archiso_loop_mnt mounts the image by file instead of searching for a label.
#
# mkarchiso copies this to /boot/grub/loopback.cfg because no `grub` bootmode is
# active (see _make_common_grubenv_and_loopbackcfg); %INSTALL_DIR% and %ARCH%
# are substituted at build time.

# Resolve the carrier device holding ${iso_path} (set by the loopback loader)
# and its filesystem UUID, which img_dev then points archiso at.
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=ryoku
timeout=15
timeout_style=menu

menuentry "Ryoku Linux installer (%ARCH%)" --class arch --class gnu-linux --class gnu --class os --id 'ryoku' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G quiet loglevel=3 console=ttyS0,115200 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Ryoku Linux installer (%ARCH%) (safe graphics)" --class arch --class gnu-linux --class gnu --class os --id 'ryoku-nomodeset' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G quiet loglevel=3 console=ttyS0,115200 console=tty0 nomodeset
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Ryoku Linux installer (%ARCH%) (copy to RAM, slow USB)" --class arch --class gnu-linux --class gnu --class os --id 'ryoku-copytoram' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" cow_spacesize=1G quiet loglevel=3 console=ttyS0,115200 console=tty0 copytoram
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
